# yt-dlp options shared by the GitHub workflow (.github/workflows/download.yml)
# and local debug mode (integrations/debug-downloader.ts).
# Output folder, bitrate and cookies are added on the command line.

--ignore-errors
--no-overwrites
--yes-playlist
--extract-audio
--audio-format mp3
--embed-metadata
--embed-thumbnail
--convert-thumbnails jpg
--windows-filenames
--trim-filenames 180
--sleep-requests 1
--sleep-interval 2
--max-sleep-interval 5
--newline
-o "%(playlist_title|Singles)s/%(title)s.%(ext)s"
