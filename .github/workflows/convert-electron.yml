name: Build Electron Releases (file converter)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-electron:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: all-files-convert

    env:
      VITE_COMMIT_SHA: ${{ github.sha }}

    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: win
          - os: macos-15
            platform: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
          cache: true

      - name: Install dependencies
        run: bun install

      - name: Build Distribution for ${{ matrix.platform }}
        run: bun run desktop:dist:${{ matrix.platform }}

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rolling Release
          prerelease: true
          overwrite: true
          files: |
            all-files-convert/release/*.exe
            all-files-convert/release/*.dmg
            all-files-convert/release/*.AppImage
            all-files-convert/release/*.zip
            all-files-convert/release/*.snap
            all-files-convert/release/*.deb
          body: "This release contains offline Electron builds of convert.to.it, built from the latest commit on the `main` branch."
